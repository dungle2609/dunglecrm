<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consulting Sales Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: thanh trên → tab theo phase → các làn stage chạy hết chiều cao (xếp chồng trên điện thoại) → ngăn deal bên phải */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EAEEF3; --lane:#E6EAF0; --card:#FFFFFF;
  --ink:#151D2C; --ink-2:#465063; --muted:#7D879A; --line:#DCE1E8; --line-2:#C2C9D5;
  --ring:rgba(37,99,235,.35); --busy:#2563EB; --btn:#151D2C; --on-btn:#FFFFFF; --on-accent:#FFFFFF;
  --danger:#C62A1E; --danger-bg:#FBE9E7; --warn:#A86200; --warn-bg:#FBF0DD; --ok:#2F8A4E; --ok-bg:#E3F2E8;
  --c0:#0B8A8F; --c0-bg:#E1F2F2; --c1:#C47400; --c1-bg:#FAEEDC; --c2:#6E56CF; --c2-bg:#ECE8FA; --c3:#2F8A4E; --c3-bg:#E3F2E8;
  --c4:#2563EB; --c4-bg:#E4ECFD; --c5:#C2385A; --c5-bg:#FBE6EC; --c6:#8A6A4C; --c6-bg:#F2ECE5; --c7:#56657E; --c7-bg:#E9EDF3;
  --lost:#7D879A; --lost-bg:#EAEEF3; --scrim:rgba(14,19,27,.32);
  --shadow:0 1px 2px rgba(21,29,44,.06),0 10px 28px rgba(21,29,44,.10);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E131B; --surface:#161D28; --surface-2:#1D2634; --lane:#131A24; --card:#1C2532;
    --ink:#E7EBF2; --ink-2:#B0B9C9; --muted:#7A8497; --line:#252F40; --line-2:#354257;
    --ring:rgba(106,165,255,.45); --busy:#6AA5FF; --btn:#E7EBF2; --on-btn:#0E131B; --on-accent:#0E131B;
    --danger:#FF7A6E; --danger-bg:#3A1C1A; --warn:#F2B441; --warn-bg:#33270F; --ok:#6FCF97; --ok-bg:#15301F;
    --c0:#45C7C9; --c0-bg:#10292C; --c1:#F2B441; --c1-bg:#2E2412; --c2:#B4A5F5; --c2-bg:#231E3A; --c3:#6FCF97; --c3-bg:#14301F;
    --c4:#6AA5FF; --c4-bg:#13233F; --c5:#F28BA5; --c5-bg:#3A1822; --c6:#CDB294; --c6-bg:#2B241C; --c7:#9AA8BD; --c7-bg:#1E2633;
    --lost:#7A8497; --lost-bg:#1D2634; --scrim:rgba(0,0,0,.5);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#161D28; --surface-2:#1D2634; --lane:#131A24; --card:#1C2532;
  --ink:#E7EBF2; --ink-2:#B0B9C9; --muted:#7A8497; --line:#252F40; --line-2:#354257;
  --ring:rgba(106,165,255,.45); --busy:#6AA5FF; --btn:#E7EBF2; --on-btn:#0E131B; --on-accent:#0E131B;
  --danger:#FF7A6E; --danger-bg:#3A1C1A; --warn:#F2B441; --warn-bg:#33270F; --ok:#6FCF97; --ok-bg:#15301F;
  --c0:#45C7C9; --c0-bg:#10292C; --c1:#F2B441; --c1-bg:#2E2412; --c2:#B4A5F5; --c2-bg:#231E3A; --c3:#6FCF97; --c3-bg:#14301F;
  --c4:#6AA5FF; --c4-bg:#13233F; --c5:#F28BA5; --c5-bg:#3A1822; --c6:#CDB294; --c6-bg:#2B241C; --c7:#9AA8BD; --c7-bg:#1E2633;
  --lost:#7A8497; --lost-bg:#1D2634; --scrim:rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}
.app{display:flex;flex-direction:column;height:100%}

/* thanh trên */
.top{display:flex;align-items:center;gap:8px;height:56px;padding:0 16px;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;min-width:0}
.brand svg{color:var(--ink-2)}
.bt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.top .btn,.top .ib{flex:none}
.sync{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok{background:var(--ok)} .sync.busy{background:var(--busy)} .sync.err{background:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn.pri{background:var(--btn);color:var(--on-btn)}
.btn.ghost{border:1px solid var(--line-2);background:var(--surface)}
.btn.ghost:hover{border-color:var(--ink-2)}
.btn.danger{background:var(--danger);color:var(--on-accent)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.ib{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;color:var(--ink-2);flex:none}
.ib:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.ib.xs{width:26px;height:26px;border-radius:6px}
.ib.xs svg{width:15px;height:15px}
.link{font-size:13px;color:var(--ink-2);padding:6px 4px;display:inline-flex;align-items:center;gap:5px}
.link:hover{color:var(--ink)}
.link svg{width:16px;height:16px}
.mini{font-size:12.5px;color:var(--ink-2);padding:2px 6px;border-radius:6px;letter-spacing:0;text-transform:none;font-weight:500;white-space:nowrap}
.mini:hover{background:var(--surface-2);color:var(--ink)}

/* tab phase */
.tabs{display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);flex:none}
.tablist{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tablist::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on{color:var(--ink);font-weight:600}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--pc)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--pc);flex:none}
.search{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted);flex:none}
.search:focus-within{border-color:var(--line-2)}
.search input{border:0;background:none;outline:none;width:160px;color:var(--ink);min-width:0}

/* bảng: mỗi stage là một làn */
.board{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 16px 14px}
.phase{display:flex;align-items:center;gap:8px;padding:10px 0;font-size:13px;color:var(--ink-2);flex:none}
.phase b{color:var(--ink);font-weight:600}
.cols{flex:1;min-height:0;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
.col{width:276px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--lane);border-radius:10px;border-top:3px solid var(--pc)}
.col-h{display:flex;align-items:center;gap:6px;padding:10px 10px 8px 12px;flex:none}
.col-t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-n{margin-left:auto;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;background:var(--card);padding:0 8px;border-radius:999px;flex:none}
.col-body{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 10px;display:flex;flex-direction:column;gap:8px}
.col.drop{box-shadow:inset 0 0 0 2px var(--pc)}
.col-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:16px 6px}
.list{flex:1;min-height:0;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sub-h{padding:12px 0 10px;color:var(--ink-2);font-size:13px}

.card{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:border-color .15s,box-shadow .15s;user-select:none;-webkit-user-select:none}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.card.sel{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc)}
.card.held{opacity:.72}
.card.dragging{opacity:.4}
.c-top{display:flex;gap:8px;align-items:baseline;min-width:0}
.c-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.c-who{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-todo{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--ink-2);min-width:0}
.c-todo i{width:10px;height:10px;border:1.5px solid var(--line-2);border-radius:3px;flex:none}
.c-todo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:2px}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;white-space:nowrap}
.tag.hold{background:var(--warn-bg);color:var(--warn)}
.tag.plain{background:var(--surface-2);color:var(--muted)}

/* nút (i) và bảng ghi chú */
.ii{width:22px;height:22px;display:inline-grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.ii:hover,.ii.on{color:var(--ink);background:var(--surface-2)}
.col .ii:hover,.col .ii.on{background:var(--card)}
.ii svg{width:16px;height:16px}
.tipbox{position:fixed;z-index:60;width:max-content;max-width:min(340px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;font-size:13px;line-height:1.45;pointer-events:none}
.tip-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tip-v{margin-bottom:10px}
.tip-v:last-child{margin-bottom:0}
.tipbox ol,.tipbox ul{margin:0;padding-left:18px;color:var(--ink-2)}
.tipbox li+li{margin-top:2px}
.tipbox .muted{color:var(--muted)}

/* ngăn deal */
#drawer-root{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.enter{animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(20px);opacity:.6}}
.d-top{position:relative;display:flex;align-items:center;gap:4px;padding:10px;border-bottom:1px solid var(--line);flex:none}
.d-name{flex:1;min-width:0;border:0;background:none;font-size:17px;font-weight:700;padding:4px 6px;border-radius:6px}
.d-name:hover,.d-name:focus{background:var(--surface-2);outline:none}
.lostbtn{height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line-2);font-size:12.5px;font-weight:600;color:var(--danger);flex:none}
.lostbtn:hover{border-color:var(--danger)}
.d-body{flex:1;overflow:auto;padding:16px 18px 32px;display:flex;flex-direction:column;gap:18px}
.fld{width:100%;min-width:0;height:32px;padding:0 9px;border:1px solid transparent;border-radius:6px;background:var(--surface-2);color:var(--ink)}
.fld:focus{border-color:var(--line-2);background:var(--surface);outline:none}
.fld::placeholder{color:var(--muted)}
textarea.fld{height:auto;min-height:60px;padding:7px 9px;resize:vertical;line-height:1.45;display:block}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.phases{display:flex;gap:4px;flex-wrap:wrap}
.ph{padding:3px 10px;border-radius:999px;color:var(--muted);border:1px solid var(--line);font-size:12.5px}
.ph:hover:not(:disabled){border-color:var(--line-2);color:var(--ink-2)}
.ph.done{color:var(--ink-2)}
.ph.on{color:var(--pc);border-color:var(--pc);background:var(--pbg);font-weight:600}
.stage{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:16px}
.st-k{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--pc)}
.st-row{display:flex;align-items:center;gap:6px}
.st-n{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.3;text-wrap:balance}
.blk{display:flex;flex-direction:column}
.blk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;min-height:24px}
.blk-tools{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.cnt{font-variant-numeric:tabular-nums;letter-spacing:0;font-weight:500;color:var(--muted);font-size:12px}
.cb{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.6px solid var(--line-2);border-radius:5px;flex:none;margin:0;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.cb:checked{background:var(--pc);border-color:var(--pc)}
.cb:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:translate(0,-1px) rotate(-45deg)}
.todo{display:flex;align-items:flex-start;gap:8px;min-width:0;margin:0 -6px;padding:1px 0 1px 6px;border-radius:6px}
.todo .cb{margin-top:6px}
.todo .del{margin-top:2px}
.todo-t{flex:1;min-width:0;min-height:30px;border:0;background:none;padding:5px 6px;border-radius:6px;color:var(--ink);line-height:1.45;resize:none;overflow:hidden;display:block}
.todo-t:hover{background:var(--surface-2)}
.todo-t:focus{outline:none;background:var(--surface-2)}
.todo-t::placeholder{color:var(--muted)}
.todo.done .todo-t{color:var(--muted);text-decoration:line-through}
.todo .del{opacity:0}
.todo:hover .del,.todo:focus-within .del{opacity:1}
@media (hover:none){.todo .del{opacity:1}}
.todo.add .plus{width:18px;text-align:center;color:var(--muted);flex:none;font-size:16px;line-height:30px}
.donebtn{align-self:flex-start;margin-top:4px}
.st-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.box{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:10px;font-size:13px}
.box.warn{background:var(--warn-bg)}
.box.bad{background:var(--lost-bg)}
.box.plain{border:1px solid var(--line)}
.box .row{flex-wrap:wrap}
.pair{display:grid;grid-template-columns:1fr 148px;gap:8px}
.sec-tg{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;padding:4px 0}
.sec-tg:hover{color:var(--ink-2)}
.sec-tg svg{width:15px;height:15px;transition:transform .15s}
.sec-tg[aria-expanded="true"] svg{transform:rotate(90deg)}
.note-in{display:block;width:100%;min-height:60px;resize:vertical;padding:8px 10px;margin-top:8px;border:1px solid transparent;border-radius:8px;background:var(--surface-2);color:var(--ink);line-height:1.45}
.note-in:focus{outline:none;border-color:var(--line-2);background:var(--surface)}
.note-bar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.log{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.log-i{display:grid;grid-template-columns:42px 1fr;gap:8px;font-size:13px}
.log-d{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:1px}
.log-t{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.log-i.ph .log-t{color:var(--muted);font-size:12.5px}

.menu{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:210px}
.menu.in{position:absolute;right:10px;top:50px}
.menu button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;text-align:left;font-size:13.5px}
.menu button:hover{background:var(--surface-2)}
.menu .danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* hộp thoại */
.modal-wrap{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--scrim);padding:16px}
.modal{width:min(440px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(820px,100%)}
.m-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.m-t{font-size:17px;font-weight:700}
.m-p{margin:0;color:var(--ink-2)}
.f{display:flex;flex-direction:column;gap:6px}
.f>label,.f>.lb{font-size:12.5px;color:var(--ink-2);font-weight:500}
.f .fld{height:38px}
.m-act{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.m-foot{position:sticky;bottom:-18px;background:var(--surface);padding:12px 0 2px;border-top:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.hint.err{color:var(--danger)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.choice button b{font-weight:700}
.choice button span{font-size:12px;color:var(--muted);line-height:1.4}
.choice button.on{border-color:var(--pc);background:var(--pbg);box-shadow:0 0 0 1px var(--pc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;background:var(--surface)}
.chip.on{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.ed{display:flex;flex-direction:column;gap:16px}
.ed-ph{border:1px solid var(--line);border-top:3px solid var(--pc);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.ed-ph-h{display:flex;align-items:center;gap:6px}
.ed-ph-h .fld{font-weight:700;font-size:15px;max-width:260px}
.ed-grid{display:grid;grid-template-columns:132px 1fr;gap:8px 12px;align-items:start}
.ed-grid>label,.ed-grid>.lb{font-size:12.5px;color:var(--ink-2);padding-top:6px}
.ed-sts{display:flex;flex-direction:column;gap:8px}
.ed-st{border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.ed-st>summary{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;cursor:pointer;list-style:none;min-width:0}
.ed-st>summary::-webkit-details-marker{display:none}
.ed-st-t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-st[open]>summary{border-bottom:1px solid var(--line)}
.ed-st .ed-grid{padding:12px}
.ed-st .hint.err{padding:10px 12px 0}
.ed .link{align-self:flex-start}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;gap:14px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--btn);color:var(--on-btn);font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

   signals:['Có biên bản hoặc báo cáo nghiệm thu'],
   todos:['Tổng hợp kết quả','Họp nghiệm thu']},
  {id:'net1',phase:'net',name:'Giữ quan hệ',outcome:'Có cơ hội khách hàng mới',

   signals:['Có lời giới thiệu khách mới','Đồng ý làm case study'],
   todos:['Hỏi giới thiệu khách mới','Mời làm case study']}
 ]};
const COLORS=8;
const LOST=['PIC chỉ đi tìm hiểu','Không tiếp cận được DM','DM chưa thấy cần','Chọn bên khác','Chưa có ngân sách','Không phù hợp','Mất liên lạc','Khác'];
const DEF_TODO={};DEFAULT.stages.forEach(s=>{DEF_TODO[s.id]=s.todos});

/* ---------- Tiện ích ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const isoDay=(t=new Date())=>t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
const dmy=iso=>{if(!iso)return'';const p=iso.split('-');return p[2]+'/'+p[1]};
const dmT=ts=>{const t=new Date(ts);return pad(t.getDate())+'/'+pad(t.getMonth()+1)};
const days=ts=>ts?Math.max(0,Math.floor((Date.now()-ts)/864e5)):0;
const fold=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\u0111/g,'d').replace(/\u0110/g,'D').toLowerCase();
const clone=o=>JSON.parse(JSON.stringify(o));
const lines=a=>(a||[]).map(x=>String(x).trim()).filter(Boolean);
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const IC={
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  dots:'<circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"/>',

/* ---------- Cấu hình phễu (phase thêm/bớt được) ---------- */
let CFG=null,ORDER=[],SBY={},IDX={},PH={},PHI={};
function nextColor(used){for(let i=0;i<COLORS;i++)if(!used.has(i))return i;return used.size%COLORS}
function fixCfg(c){
  if(!c||!Array.isArray(c.phases)||!Array.isArray(c.stages))return clone(DEFAULT);
  c.phases=c.phases.filter(p=>p&&p.id);
  if(!c.phases.length)return clone(DEFAULT);
  const LEG={pic:0,dm:1,co:2,net:3},used=new Set();
  c.phases.forEach(p=>{if(typeof p.color!=='number'||p.color<0||p.color>=COLORS)p.color=(p.id in LEG&&!used.has(LEG[p.id]))?LEG[p.id]:nextColor(used);used.add(p.color);delete p.won});
  c.v=2;
  const ids=new Set(c.phases.map(p=>p.id));
  c.stages=c.stages.filter(s=>s&&s.id&&ids.has(s.phase));
  c.phases.forEach(p=>{if(!c.stages.some(s=>s.phase===p.id))c.stages.push({id:'s'+uid(),phase:p.id,name:'Bước mới',outcome:'',service:[],signals:[],todos:[]})});
  c.stages.forEach(s=>{if(!Array.isArray(s.todos))s.todos=(DEF_TODO[s.id]||[]).slice();if(!Array.isArray(s.service))s.service=[];if(!Array.isArray(s.signals))s.signals=[]});
  return c;
}
function applyCfg(c){
  CFG=fixCfg(c);
  PH={};PHI={};CFG.phases.forEach((p,i)=>{PH[p.id]=p;PHI[p.id]=i});
  ORDER=[];CFG.phases.forEach(p=>CFG.stages.forEach(s=>{if(s.phase===p.id)ORDER.push(s)}));
  SBY={};IDX={};ORDER.forEach((s,i)=>{SBY[s.id]=s;IDX[s.id]=i});
}
applyCfg(clone(DEFAULT));
const pcv=p=>'--pc:var(--c'+(p?p.color:0)+');--pbg:var(--c'+(p?p.color:0)+'-bg)';
const stageOf=d=>SBY[d.stage]||ORDER[0];
const phaseOf=d=>PH[stageOf(d).phase];
const stagesOf=ph=>ORDER.filter(s=>s.phase===ph);
const nextOf=s=>ORDER[IDX[s.id]+1];
const prevOf=s=>ORDER[IDX[s.id]-1];
function norm(d){if(!Array.isArray(d.todos))d.todos=[];return d}

/* ---------- Trạng thái + lưu trữ ---------- */
// S.mode: 'cloud' = kho db của artifact claude.ai · 'fb' = đồng bộ real-time qua Firebase (bản chạy ngoài claude.ai) · 'local' = chỉ trình duyệt này
const S={mode:'init',db:null,dl:null,loaded:false,deals:{},tab:LS.get('cj.tab')||'',q:'',open:null,ui:{},sync:'idle',logOpen:LS.get('cj.log')!=='0',dragId:null};
const cur=()=>S.deals[S.open];
function addLog(d,k,x){d.log=d.log||[];d.log.push({t:Date.now(),k:k,x:x,st:d.stage});if(d.log.length>300)d.log=d.log.slice(-300)}
const dirty=new Set(),timers={},inflight={},again={};
function setSync(s){S.sync=s;const el=$('#sync');if(!el)return;el.className='sync '+(S.mode==='local'?'':s);
  el.title=S.mode==='local'?'Đang lưu trên trình duyệt này':S.mode==='fb'?fbTitle(s):({ok:'Đã lưu',busy:'Đang lưu…',err:'Chưa lưu được',idle:'Đã kết nối'}[s]||'')}
function saveLocal(){LS.set('cj.v1',JSON.stringify({deals:S.deals,cfg:CFG}))}
function loadLocal(){try{const o=JSON.parse(LS.get('cj.v1')||'{}');S.deals=o.deals||{};if(o.cfg)applyCfg(o.cfg)}catch(e){S.deals={}}
  Object.values(S.deals).forEach(norm)}
function save(id,delay){const d=S.deals[id];if(d)d.updated=Date.now();dirty.add(id);if(S.mode==='fb')fbPend(id,true);clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),delay==null?500:delay)}
async function writeDoc(id){
  const d=S.deals[id];
  if(S.mode==='fb'){fbPend(id,true);saveLocal();await fbWrite('deals/'+id,d?fbRec(d,d.updated):null);if(!again[id])fbPend(id,false);return}
  if(S.mode!=='cloud'){saveLocal();return}
  const ref=S.db.doc('deals/'+id);
  try{d?await ref.set(clone(d)):await ref.delete()}
  catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));const d2=S.deals[id];d2?await ref.set(clone(d2)):await ref.delete()}else throw e}
}
async function flush(id){
  if(inflight[id]){again[id]=true;return}
  inflight[id]=true;setSync('busy');
  try{await writeDoc(id);setSync('ok')}
  catch(e){if(S.mode==='fb')fbFail(e);else{setSync('err');toast(e&&e.code==='quota_exceeded'?'Kho dữ liệu đã đầy. Xoá bớt deal cũ rồi thử lại.':'Chưa lưu được thay đổi. Kiểm tra mạng rồi sửa lại một lần nữa.')}}
  inflight[id]=false;
  if(again[id]){again[id]=false;flush(id)}else dirty.delete(id);
}
async function saveMeta(name,obj){
  if(S.mode==='fb'){
    saveLocal();FB.meta[name]=1;fbSave();setSync('busy');
    try{await fbWrite('meta/'+name,fbRec(obj));delete FB.meta[name];fbSave();setSync('ok')}catch(e){fbFail(e)}
    return}
  if(S.mode!=='cloud'){saveLocal();return}
  setSync('busy');
  try{await S.db.doc('meta/'+name).set(clone(obj));setSync('ok')}catch(e){setSync('err');toast('Chưa lưu được. Thử lại sau.')}
}
function afterData(){renderMain();if(S.open){if(!S.deals[S.open])closeDrawer();else if(!drawerBusy())renderDrawer()}}
function subscribe(){
  S.db.collection('deals').onSnapshot(snap=>{
    const next={};
    snap.docs.forEach(doc=>{next[doc.id]=norm(clone(doc.data()))});
    dirty.forEach(id=>{if(S.deals[id])next[id]=S.deals[id];else delete next[id]});
    S.deals=next;S.loaded=true;if(S.sync==='idle')setSync('ok');
    afterData();
  },()=>{setSync('err');toast('Mất kết nối với dữ liệu. Tải lại trang để thử lại.')});
  S.db.doc('meta/config').onSnapshot(s=>{if(s.exists){applyCfg(clone(s.data()));if(S.loaded)afterData()}},()=>{});
}

/* ---------- Đồng bộ real-time qua Firebase Realtime Database ----------
   Dùng khi app chạy ngoài claude.ai (VD GitHub Pages) vì khung artifact chặn mọi kết nối ra ngoài.
   Nói chuyện bằng REST + EventSource, không cần thư viện. Mọi máy nhập cùng một mã đồng bộ thì dùng chung một bản dữ liệu:
     csj/<mã>/deals/<id>   = {s: JSON của deal, t: lúc sửa, dev: máy sửa}
     csj/<mã>/meta/config  = {s: JSON của phễu, t, dev}
   Lưu dạng chuỗi JSON để Firebase không làm rơi mảng rỗng hay đổi mảng thành object.
   Luật bảo mật nằm ở database.rules.json: chỉ đọc/ghi được khi biết mã (≥16 ký tự), không ai liệt kê được các mã.
   Mã giống mật khẩu: gõ tay trên từng máy, không ghi vào code (code công khai trên GitHub).
   Trình duyệt vẫn giữ một bản sao (cj.v1) nên mở app khi mất mạng vẫn thấy deal; sửa lúc mất mạng thì nằm trong FB.pend, có mạng lại sẽ tự gửi. */
const FB_DB='https://consulting-sales-journey-default-rtdb.asia-southeast1.firebasedatabase.app';
const IN_CLAUDE=!!(window.claude&&typeof window.claude.use==='function')||/\.claudeusercontent\.com$/.test(location.hostname);
const CODE_OK=/^[A-Za-z0-9_-]{16,128}$/;
// FB.code: mã đồng bộ · FB.dev: mã của máy này · FB.pend: id deal đã sửa trên máy này mà chưa gửi lên được · FB.meta: phễu chưa gửi lên được · FB.join: lần nối đầu tiên với mã này, cần gộp dữ liệu hai bên
const FB=(()=>{let o=null;try{o=JSON.parse(LS.get('cj.sync')||'null')}catch(e){}o=o&&typeof o==='object'?o:{};
  if(!o.dev)o.dev=uid();if(!Array.isArray(o.pend))o.pend=[];if(!o.meta||typeof o.meta!=='object')o.meta={};return o})();
let fbES=null,fbGen=0,fbRetryT=0,fbConT=0,fbWarned=false,fbAt=0,fbMsg='';
function fbSave(){LS.set('cj.sync',JSON.stringify({code:FB.code||null,dev:FB.dev,pend:FB.pend,meta:FB.meta,join:!!FB.join}))}
function fbPend(id,on){const i=FB.pend.indexOf(id);if(on&&i<0)FB.pend.push(id);else if(!on&&i>=0)FB.pend.splice(i,1);else return;fbSave()}
const fbURL=p=>FB_DB+'/csj/'+encodeURIComponent(FB.code)+(p?'/'+p:'')+'.json';
const fbRec=(o,t)=>({s:JSON.stringify(o),t:t||Date.now(),dev:FB.dev});
const fbParse=r=>{try{return r&&typeof r.s==='string'?JSON.parse(r.s):null}catch(e){return null}};
const hhmm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
function fbTitle(s){return s==='ok'?'Đã đồng bộ Firebase'+(fbAt?' lúc '+hhmm(fbAt):''):s==='busy'?'Đang gửi lên Firebase…':s==='err'?(fbMsg||'Chưa đồng bộ được'):'Đang kết nối Firebase…'}
async function fbWrite(path,val){
  let r;
  try{r=await fetch(fbURL(path),val==null?{method:'DELETE',cache:'no-store'}:{method:'PUT',body:JSON.stringify(val),cache:'no-store'})}
  catch(e){throw {code:'offline'}}
  if(!r.ok)throw {code:r.status===401||r.status===403?'denied':'http',status:r.status};
  fbAt=Date.now();fbMsg='';fbWarned=false;
}
function fbFail(e){
  fbMsg=e&&e.code==='denied'?'Firebase từ chối ghi. Kiểm tra lại mã đồng bộ.':'Mất kết nối Firebase. Thay đổi vẫn nằm trên máy này và sẽ tự gửi khi có mạng.';
  setSync('err');if(!fbWarned){fbWarned=true;toast(fbMsg)}
  clearTimeout(fbRetryT);fbRetryT=setTimeout(fbRetry,15000);
}
// gửi lại mọi thứ chưa lên được
function fbRetry(){
  if(S.mode!=='fb')return;
  clearTimeout(fbRetryT);
  FB.pend.slice().forEach(id=>flush(id));
  if(FB.meta.config)saveMeta('config',CFG);
}
function fbDone(){S.loaded=true;fbAt=Date.now();fbMsg='';saveLocal();setSync(FB.pend.length||FB.meta.config?'busy':'ok');afterData()}
// Toàn bộ bản trên mây → màn hình. Deal đang sửa dở hoặc chưa gửi được thì giữ bản trên máy.
function fbApplyAll(data){
  data=data||{};const rd=data.deals||{},rm=data.meta||{};
  if(FB.join){fbJoin(rd,rm);return}
  const next={};
  Object.keys(rd).forEach(id=>{const d=fbParse(rd[id]);if(d)next[id]=norm(d)});
  new Set([...dirty,...FB.pend]).forEach(id=>{if(S.deals[id])next[id]=S.deals[id];else delete next[id]});
  S.deals=next;
  if(rm.config&&!FB.meta.config){const c=fbParse(rm.config);if(c)applyCfg(c)}
  fbDone();
  if(FB.pend.length||FB.meta.config)fbRetry();
}
// Một deal đổi trên mây (máy khác vừa sửa, hoặc tiếng vọng của chính máy này)
function fbApplyDeal(id,rec){
  if(dirty.has(id)||FB.pend.includes(id))return;
  const loc=S.deals[id];
  if(rec&&rec.dev===FB.dev&&loc&&(rec.t||0)<(loc.updated||0))return;
  if(!rec){if(!loc)return;delete S.deals[id]}
  else{const d=fbParse(rec);if(!d)return;S.deals[id]=norm(d)}
  fbDone();
}
// Lần nối đầu với một mã trên máy này: gộp hai bên, deal nào sửa sau thì giữ bản đó; phễu lấy bản trên mây nếu đã có
function fbJoin(rd,rm){
  const next={};let up=0;
  Object.keys(rd).forEach(id=>{const d=fbParse(rd[id]);if(d)next[id]=norm(d)});
  Object.keys(S.deals).forEach(id=>{const l=S.deals[id],r=next[id];if(!r||(l.updated||0)>(r.updated||0)){next[id]=l;if(FB.pend.indexOf(id)<0)FB.pend.push(id);up++}});
  S.deals=next;
  const c=fbParse(rm.config);if(c)applyCfg(c);else FB.meta.config=1;
  FB.join=false;fbSave();fbDone();fbRetry();
  toast('Đã bật đồng bộ: '+Object.keys(next).length+' deal'+(up?', trong đó '+up+' deal từ máy này được đưa lên':''));
}
async function fbRefetch(gen){
  try{const r=await fetch(fbURL(''),{cache:'no-store'});if(!r.ok||gen!==fbGen)return;fbApplyAll(await r.json())}catch(e){}
}
// Luồng real-time: Firebase đẩy sự kiện put/patch mỗi khi dữ liệu dưới csj/<mã> đổi
function fbConnect(){
  const gen=++fbGen;clearTimeout(fbConT);
  if(fbES){fbES.close();fbES=null}
  if(S.mode!=='fb'||!FB.code)return;
  if(S.sync!=='err')setSync('idle');
  const es=new EventSource(fbURL(''));fbES=es;
  const apply=(m,patch)=>{
    if(!m||typeof m.path!=='string')return;
    const seg=m.path.split('/').filter(Boolean);
    if(!seg.length){if(patch)fbRefetch(gen);else fbApplyAll(m.data);return}
    if(seg[0]==='deals'&&seg.length===1&&patch){Object.keys(m.data||{}).forEach(id=>fbApplyDeal(id,m.data[id]));return}
    if(seg[0]==='deals'&&seg.length===2&&!patch){fbApplyDeal(seg[1],m.data);return}
    if(seg[0]==='meta'&&seg[1]==='config'&&seg.length===2&&!patch){const c=fbParse(m.data);if(c&&!FB.meta.config){applyCfg(c);fbDone()}return}
    fbRefetch(gen);
  };
  const on=(type,fn)=>es.addEventListener(type,e=>{if(gen!==fbGen)return;let m=null;try{m=JSON.parse(e.data)}catch(_){}fn(m)});
  on('put',m=>apply(m,false));
  on('patch',m=>apply(m,true));
  on('cancel',()=>{es.close();fbMsg='Firebase từ chối đọc. Kiểm tra lại mã đồng bộ.';setSync('err');toast(fbMsg)});
  es.onerror=()=>{
    if(gen!==fbGen)return;
    fbMsg='Mất kết nối Firebase. Đang thử kết nối lại…';setSync('err');
    if(es.readyState===2)fbConT=setTimeout(()=>{if(gen===fbGen)fbConnect()},15000);
  };
}
function fbStart(){S.mode='fb';fbConnect()}
function fbEnable(code){FB.code=code;FB.join=true;FB.pend=[];FB.meta={};fbWarned=false;fbSave();S.mode='fb';setSync('idle');fbConnect()}
function fbDisable(){
  fbGen++;clearTimeout(fbRetryT);clearTimeout(fbConT);if(fbES){fbES.close();fbES=null}
  FB.code=null;FB.join=false;FB.pend=[];FB.meta={};fbSave();S.mode='local';saveLocal();setSync('ok');
}
window.addEventListener('online',()=>{if(S.mode!=='fb')return;if(!fbES||fbES.readyState===2)fbConnect();fbRetry()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.mode==='fb'&&(!fbES||fbES.readyState===2))fbConnect()});

async function init(){
  let db=null;
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('downloads').then(x=>{S.dl=x}).catch(()=>{});
    try{db=await window.claude.use('db')}catch(e){db=null}
  }
  if(db){S.mode='cloud';S.db=db;setSync('idle');subscribe()}
  else{S.mode='local';loadLocal();S.loaded=true;if(!IN_CLAUDE&&FB.code)fbStart();else setSync('ok');renderMain()}
}

/* ---------- Thanh trên + tab ---------- */
function fixTab(){if(S.tab!=='lost'&&!PH[S.tab])S.tab=CFG.phases[0].id}
function counts(){const c={lost:0};CFG.phases.forEach(p=>c[p.id]=0);Object.values(S.deals).forEach(d=>{if(d.status==='lost')c.lost++;else c[stageOf(d).phase]++});return c}
function renderTabs(){
  fixTab();const c=counts();
  $('#tablist').innerHTML=CFG.phases.map(p=>'<button class="tab'+(S.tab===p.id&&!S.q?' on':'')+'" role="tab" data-tab="'+p.id+'" style="'+pcv(p)+'"><span class="dot"></span>'+esc(p.name)+'<span class="n">'+c[p.id]+'</span></button>').join('')
    +'<button class="tab'+(S.tab==='lost'&&!S.q?' on':'')+'" role="tab" data-tab="lost" style="--pc:var(--lost)"><span class="dot"></span>Lost<span class="n">'+c.lost+'</span></button>';
}
function renderMain(){renderTabs();renderBoard()}
let rmT=0;function renderMainSoon(){cancelAnimationFrame(rmT);rmT=requestAnimationFrame(renderMain)}

/* ---------- Bảng ---------- */
function sortDeals(arr){return arr.sort((a,b)=>{const ha=a[1].status==='hold'?1:0,hb=b[1].status==='hold'?1:0;if(ha!==hb)return ha-hb;return (b[1].updated||0)-(a[1].updated||0)})}
function card(id,d,mode){
  const s=stageOf(d),p=PH[s.phase],today=isoDay(),drag=mode==null;
  let h='<div class="card'+(S.open===id?' sel':'')+(d.status==='hold'?' held':'')+'" role="button" tabindex="0" data-id="'+id+'"'+(drag?' draggable="true"':'')+' style="'+pcv(p)+'">';
  h+='<span class="c-top"><span class="c-name">'+esc(d.name||'Chưa đặt tên')+'</span></span>';
  if(mode){const ls=mode==='lost'&&d.lostStage&&SBY[d.lostStage]?SBY[d.lostStage]:s;h+='<span class="c-who">'+esc(PH[ls.phase].name+' · '+ls.name)+'</span>'}
  if(d.contact)h+='<span class="c-who">'+esc(d.contact)+'</span>';
  const td=mode!=='lost'&&(d.todos||[]).find(t=>!t.done);
  if(td)h+='<span class="c-todo"><i></i><span>'+esc(td.t)+'</span></span>';
  h+='<span class="c-foot">';
  if(mode==='lost')h+='<span>'+esc(d.lostReason||'Lost')+(d.lostAt?' · '+dmT(d.lostAt):'')+'</span>';
  else{
    const n=days(d.stageAt);h+='<span>'+(n?n+' ngày':'Mới vào')+'</span>';
    if(d.status==='hold')h+='<span class="tag hold">'+(d.holdUntil&&d.holdUntil<=today?'Đến hẹn':'Hoãn đến '+dmy(d.holdUntil))+'</span>';
    if(d.sample)h+='<span class="tag plain">Mẫu</span>';
  }
  return h+'</span></div>';
}
function renderBoard(){
  const el=$('#board');
  if(!S.loaded){el.innerHTML='<p class="sub-h">Đang tải deal…</p>';return}
  fixTab();
  const all=Object.entries(S.deals);
  if(S.q){
    const q=fold(S.q);
    const hit=sortDeals(all.filter(([,d])=>fold([d.name,d.contact,d.dmName,d.source].join(' ')).includes(q)));
    el.innerHTML='<div class="list"><div class="sub-h">'+(hit.length?hit.length+' deal khớp “'+esc(S.q)+'”':'Không có deal nào khớp “'+esc(S.q)+'”')+'</div><div class="grid">'+hit.map(([id,d])=>card(id,d,d.status==='lost'?'lost':'find')).join('')+'</div></div>';
    return;
  }
  if(S.tab==='lost'){
    const ls=all.filter(([,d])=>d.status==='lost').sort((a,b)=>(b[1].lostAt||0)-(a[1].lostAt||0));
    el.innerHTML='<div class="list"><div class="sub-h">Deal đã lost. Mở một deal để xem lý do hoặc mở lại.</div>'+(ls.length?'<div class="grid">'+ls.map(([id,d])=>card(id,d,'lost')).join('')+'</div>':'<p class="hint">Chưa có deal nào lost.</p>')+'</div>';
    return;
  }
  const by={};all.forEach(([id,d])=>{if(d.status==='lost')return;(by[stageOf(d).id]=by[stageOf(d).id]||[]).push([id,d])});
  const ph=PH[S.tab];
  let h='<div class="phase" style="'+pcv(ph)+'"><span class="dot"></span><b>Phase '+esc(ph.name)+'</b>'+infoBtn('p:'+ph.id,'Ghi chú của phase')
    +(all.length?'':'<span class="hint">Chưa có deal nào. Bấm “Deal” để thêm.</span>')+'<span class="sp"></span><button class="link" data-hact="editor">'+ic('sliders')+'Chỉnh phễu</button></div><div class="cols">';
  h+=stagesOf(ph.id).map(st=>{
    const items=sortDeals(by[st.id]||[]);
    return '<section class="col'+(items.length?'':' is-empty')+'" data-st="'+st.id+'" style="'+pcv(ph)+'"><div class="col-h"><span class="col-t" title="'+esc(st.name)+'">'+esc(st.name)+'</span>'+infoBtn('s:'+st.id,'Ghi chú của '+st.name)+'<span class="col-n">'+items.length+'</span></div><div class="col-body">'
      +(items.length?items.map(([id,d])=>card(id,d)).join(''):'<div class="col-empty">Chưa có deal</div>')+'</div></section>';
  }).join('');
  el.innerHTML=h+'</div>';
}

/* ---------- Bảng ghi chú (i): outcome, service, tín hiệu chuyển bước ---------- */
const tip=$('#tip');let tipFor=null,tipPinned=false;
function infoHTML(key){
  const p=key.split(':'),isPhase=p[0]==='p',o=isPhase?PH[p[1]]:SBY[p[1]];if(!o)return'';
  const sec=(label,arr,tag)=>{const a=lines(arr);return '<div class="tip-k">'+label+'</div><div class="tip-v">'+(a.length?'<'+tag+'>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</'+tag+'>':'<span class="muted">Chưa ghi</span>')+'</div>'};
  let h='<div class="tip-k">Outcome</div><div class="tip-v">'+(o.outcome?esc(o.outcome):'<span class="muted">Chưa ghi</span>')+'</div>'+sec('Service',o.service,'ol');
  if(!isPhase)h+=sec('Tín hiệu chuyển bước',o.signals,'ul');
  return h;
}
function showTip(el){
  const h=infoHTML(el.dataset.info);if(!h)return;
  if(tipFor&&tipFor!==el)tipFor.classList.remove('on');
  tip.innerHTML=h;tip.hidden=false;tipFor=el;el.classList.add('on');
  const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  const x=Math.min(Math.max(8,r.left-10),innerWidth-tw-8);let y=r.bottom+6;if(y+th>innerHeight-8)y=Math.max(8,r.top-th-6);
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function hideTip(){tip.hidden=true;if(tipFor)tipFor.classList.remove('on');tipFor=null;tipPinned=false}
document.addEventListener('mouseover',e=>{if(tipPinned)return;const el=e.target.closest&&e.target.closest('[data-info]');if(el&&el!==tipFor)showTip(el)});
document.addEventListener('mouseout',e=>{if(tipPinned||!tipFor)return;const el=e.target.closest&&e.target.closest('[data-info]');if(el===tipFor&&!el.contains(e.relatedTarget))hideTip()});
document.addEventListener('focusin',e=>{const el=e.target.closest&&e.target.closest('[data-info]');if(el)showTip(el)});
document.addEventListener('focusout',e=>{const el=e.target.closest&&e.target.closest('[data-info]');if(el&&el===tipFor&&!tipPinned)hideTip()});
document.addEventListener('scroll',()=>{if(tipFor)hideTip()},true);

/* ---------- Ngăn deal (khung giữ nguyên, chỉ thay nội dung → không nháy) ---------- */

function drawerBusy(){const a=document.activeElement;return a&&dr.contains(a)&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.type!=='checkbox'}

function fit(el){el.style.height='auto';el.style.height=el.scrollHeight+'px'}
const todoRow=t=>'<div class="todo'+(t.done?' done':'')+'"><input class="cb" type="checkbox" data-tk="'+t.id+'"'+(t.done?' checked':'')+' aria-label="Đánh dấu đã xong"><textarea class="todo-t" rows="1" data-tt="'+t.id+'" aria-label="Việc cần làm">'+esc(t.t)+'</textarea><button type="button" class="ib xs del" data-act="todoDel" data-v="'+t.id+'" aria-label="Xoá việc">'+ic('x')+'</button></div>';
function stageTodos(d,s){const mine=(d.todos||[]).filter(t=>t.st===s.id);return (mine.length?mine:(d.todos||[]).filter(t=>!t.done)).map(t=>t.t.trim()).filter(Boolean)}
function renderDrawer(){

  const sc=body.scrollTop,noteDraft=($('#f-note')||{}).value||'',todoDraft=($('#todo-new')||{}).value||'';

  aside.setAttribute('style',pcv(ph));aside.setAttribute('aria-label',d.name||'Deal');

  if(document.activeElement!==$('#f-name')){
    let t='<button class="ib" data-act="close" aria-label="Đóng">'+ic('x')+'</button><input class="d-name" id="f-name" data-f="name" value="'+esc(d.name)+'" placeholder="Tên công ty" aria-label="Tên công ty">';

    top.innerHTML=t;

/* ---------- Chuyển bước, chốt, lost ---------- */
let toastT=0;
function toast(msg,undo){
  const el=$('#toast');el.innerHTML='<span>'+esc(msg)+'</span>'+(undo?'<button type="button" id="undo">Hoàn tác</button>':'');
  el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},undo?6500:3600);
  if(undo)$('#undo').onclick=()=>{el.hidden=true;undo()};
}
function restore(id,before){S.deals[id]=before;save(id,0);renderMain();if(S.open===id)renderDrawer()}
function requestMove(id,to){
  const d=S.deals[id];if(!d||d.stage===to||!SBY[to]||d.status==='lost')return;
  moveTo(id,to);
}
function moveTo(id,to){
  const d=S.deals[id];if(!d||d.stage===to)return;
  const before=clone(d),fp=stageOf(d).phase,tp=SBY[to].phase;
  d.stage=to;d.stageAt=Date.now();
  if(fp!==tp)addLog(d,'phase',PH[fp].name+' → '+PH[tp].name);
  S.ui.menu=false;S.ui.panel=null;
  save(id,0);renderMain();if(S.open===id)renderDrawer();
  toast('Đã chuyển sang “'+SBY[to].name+'”',()=>restore(id,before));
}
function openLost(id){
  const d=S.deals[id];let reason='';
  modal('<div class="m-h"><span class="m-t">Lost deal này?</span>'+xBtn+'</div><p class="m-p"><b>'+esc(d.name)+'</b> sẽ chuyển sang mục Lost. Bạn mở lại được bất cứ lúc nào.</p><div class="f"><span class="lb">Lý do (không bắt buộc)</span><div class="chips">'+LOST.map(r=>'<button type="button" class="chip" data-r="'+esc(r)+'">'+esc(r)+'</button>').join('')+'</div></div><div class="f"><label for="l-note">Ghi chú</label><input class="fld" id="l-note" placeholder="Không bắt buộc"></div><div class="m-act"><button type="button" class="btn ghost" data-x>Không</button><button type="button" class="btn danger" id="l-ok">Có, lost deal</button></div>');
  mr.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{reason=reason===b.dataset.r?'':b.dataset.r;mr.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x.dataset.r===reason))}));
  $('#l-ok').addEventListener('click',()=>{const note=$('#l-note').value.trim();closeModal();markLost(id,reason,note)});
}
function markLost(id,reason,note){
  const d=S.deals[id];if(!d)return;const before=clone(d);
  d.status='lost';d.lostReason=reason;d.lostNote=note;d.lostStage=d.stage;d.lostAt=Date.now();delete d.holdUntil;delete d.holdNote;
  addLog(d,'phase',phaseOf(d).name+' → Lost'+(reason?' · '+reason:'')+(note?' · '+note:''));
  S.ui={};save(id,0);renderMain();if(S.open===id)renderDrawer();
  toast('Đã chuyển deal sang Lost',()=>restore(id,before));
}
function addTodo(text){const d=cur();if(!d)return;d.todos=d.todos||[];d.todos.push({id:uid(),t:text,done:false,st:d.stage,at:Date.now()})}
function act(a,el){
  const d=cur(),u=S.ui,v=el.dataset.v;
  if(a==='close'){closeDrawer();return}
  if(!d)return;
  switch(a){
    case'menu':u.menu=!u.menu;renderDrawer();return;
    case'lost':openLost(S.open);return;
    case'phase':{if(PH[v]&&v!==stageOf(d).phase)requestMove(S.open,stagesOf(v)[0].id);return}
    case'adv':{const nx=nextOf(stageOf(d));if(nx)requestMove(S.open,nx.id);return}
    case'back':{const pv=prevOf(stageOf(d));if(pv)requestMove(S.open,pv.id);return}
    case'hold':S.ui={panel:'hold'};renderDrawer();{const hd=$('#h-date');if(hd)hd.focus()}return;
    case'del':S.ui={panel:'del'};renderDrawer();return;
    case'cancelPanel':S.ui={};renderDrawer();return;
    case'holdOk':
      if(!u.holdDate){toast('Chọn ngày hẹn quay lại');return}
      d.status='hold';d.holdUntil=u.holdDate;d.holdNote=u.holdNote||'';S.ui={};save(S.open,0);renderDrawer();renderMain();return;
    case'resume':d.status='open';delete d.holdUntil;delete d.holdNote;save(S.open,0);renderDrawer();renderMain();return;
    case'reopen':{const pn=phaseOf(d).name;d.status='open';d.stageAt=Date.now();['lostReason','lostNote','lostStage','lostAt'].forEach(k=>delete d[k]);addLog(d,'phase','Lost → '+pn);save(S.open,0);renderDrawer();renderMain();return}
    case'delOk':{const id=S.open,nm=d.name;delete S.deals[id];save(id,0);closeDrawer();renderMain();toast('Đã xoá deal '+(nm||''));return}
    case'note':addNote();return;
    case'toggleLog':S.logOpen=!S.logOpen;LS.set('cj.log',S.logOpen?'1':'0');renderDrawer();return;
    case'toggleDone':u.showDone=!u.showDone;renderDrawer();return;
    case'todoDel':d.todos=(d.todos||[]).filter(t=>t.id!==v);save(S.open,0);renderDrawer();renderMainSoon();return;
    case'useTpl':{
      const have=new Set((d.todos||[]).filter(t=>!t.done).map(t=>t.t.trim()));let n=0;
      lines(stageOf(d).todos).forEach(x=>{if(!have.has(x)){addTodo(x);n++}});
      if(n){save(S.open,0);renderDrawer();renderMainSoon()}
      toast(n?'Đã thêm '+n+' việc từ mẫu. Sửa hoặc xoá tuỳ ý.':'Các việc trong mẫu đã có trong danh sách');return}
    case'saveTpl':{
      const s=stageOf(d),list=stageTodos(d,s);if(!list.length)return;
      const old=(s.todos||[]).slice();s.todos=list;saveMeta('config',CFG);renderDrawer();
      toast('Đã lưu '+list.length+' việc làm mẫu cho bước “'+s.name+'”',()=>{s.todos=old;saveMeta('config',CFG);if(S.open)renderDrawer()});return}
  }
}
function addNote(){
  const d=cur(),ta=$('#f-note');if(!d||!ta)return;
  const x=ta.value.trim();if(!x)return;
  addLog(d,'note',x);save(S.open,0);ta.value='';renderDrawer();
}
dr.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b&&!b.disabled){e.preventDefault();act(b.dataset.act,b);return}
  if(S.ui.menu&&!e.target.closest('.menu')&&!e.target.closest('[data-info]')){S.ui.menu=false;renderDrawer()}
});
dr.addEventListener('change',e=>{
  const t=e.target,d=cur();if(!d||!t.dataset.tk)return;
  const td=(d.todos||[]).find(x=>x.id===t.dataset.tk);if(td){td.done=t.checked;if(t.checked)td.doneAt=Date.now();else delete td.doneAt}
  save(S.open,0);renderDrawer();renderMainSoon();
});
dr.addEventListener('input',e=>{
  const t=e.target,d=cur();if(!d)return;const u=S.ui;
  if(t.dataset.tt){fit(t);const td=(d.todos||[]).find(x=>x.id===t.dataset.tt);if(td){td.t=t.value;save(S.open,700);renderMainSoon()}return}
  const f=t.dataset.f;if(!f)return;
  if(f==='holdNote'){u.holdNote=t.value;return}
  if(f==='holdDate'){u.holdDate=t.value;return}
  if(f==='name'){d.name=t.value;save(S.open,600);renderMainSoon()}
});
dr.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.id==='f-note'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();addNote();return}
  if(e.key!=='Enter'||e.isComposing)return;
  if(t.id==='todo-new'){e.preventDefault();const x=t.value.trim();if(!x)return;addTodo(x);t.value='';save(S.open,0);renderDrawer();renderMainSoon();const n=$('#todo-new');if(n)n.focus();return}
  if(t.dataset.tt){e.preventDefault();const n=$('#todo-new');if(n)n.focus()}
});
dr.addEventListener('focusout',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.tt||!t.isConnected)return;
  if(t.value.trim())return;
  const d=cur();if(!d)return;d.todos=(d.todos||[]).filter(x=>x.id!==t.dataset.tt);save(S.open,0);setTimeout(()=>{if(S.open)renderDrawer();renderMainSoon()},0);
});

    dft.phases.push({id:pid,name:'Phase mới',color:nextColor(used),outcome:'',service:[]});
    dft.stages.push({id:sid,phase:pid,name:'Bước mới',outcome:'',service:[],signals:[],todos:[]});
    renderEditor('[data-e="pname"][data-p="'+pid+'"]');{const n=mr.querySelector('[data-e="pname"][data-p="'+pid+'"]');if(n)n.select()}return}
  if(a==='add'){const id='s'+uid();dft.stages.push({id:id,phase:b.dataset.p,name:'Bước mới',outcome:'',service:[],signals:[],todos:[]});ED.open.add(id);renderEditor('[data-e="sname"][data-s="'+id+'"]');{const n=mr.querySelector('[data-e="sname"][data-s="'+id+'"]');if(n)n.select()}return}
  if(b.dataset.p&&!b.dataset.s&&a!=='add'){
    const p=dft.phases.find(x=>x.id===b.dataset.p);if(!p)return;const pi=dft.phases.indexOf(p);
    if(a==='pup'||a==='pdown'){const j=a==='pup'?pi-1:pi+1;if(j<0||j>=dft.phases.length)return;dft.phases[pi]=dft.phases[j];dft.phases[j]=p;renderEditor();return}
    if(a==='pdel'){
      const ids=new Set(dft.stages.filter(s=>s.phase===p.id).map(s=>s.id)),n=dealsIn(st=>ids.has(st));
      if(n){ED.err['p:'+p.id]='Còn '+n+' deal trong phase này (kể cả deal lost). Chuyển các deal sang phase khác trước khi xoá.';renderEditor();return}
      if(dft.phases.length<2){ED.err['p:'+p.id]='Phễu cần ít nhất một phase.';renderEditor();return}
      dft.phases=dft.phases.filter(x=>x!==p);dft.stages=dft.stages.filter(s=>s.phase!==p.id);delete ED.err['p:'+p.id];renderEditor();return}
    return;
  }
  const s=dft.stages.find(x=>x.id===b.dataset.s);if(!s)return;
  const same=dft.stages.filter(x=>x.phase===s.phase),i=same.indexOf(s);
  if(a==='del'){
    const n=dealsIn(st=>st===s.id);
    if(n){ED.err[s.id]='Còn '+n+' deal ở bước này (kể cả deal lost). Chuyển các deal sang bước khác trước khi xoá.';ED.open.add(s.id);renderEditor();return}
    if(same.length<2){ED.err[s.id]='Mỗi phase cần ít nhất một stage. Muốn bỏ hẳn thì xoá phase.';ED.open.add(s.id);renderEditor();return}
    dft.stages=dft.stages.filter(x=>x!==s);delete ED.err[s.id];ED.open.delete(s.id);renderEditor();return}
  if(a==='up'||a==='down'){
    const j=a==='up'?i-1:i+1;if(j<0||j>=same.length)return;
    const o=same[j],ai=dft.stages.indexOf(s),bi=dft.stages.indexOf(o);dft.stages[ai]=o;dft.stages[bi]=s;renderEditor();return}
});
function saveEditor(){
  const dft=ED.draft;
  dft.phases.forEach(p=>{p.name=String(p.name||'').trim()||'Phase';p.outcome=String(p.outcome||'').trim();p.service=lines(p.service)});
  dft.stages.forEach(s=>{s.name=String(s.name||'').trim()||'Bước mới';s.outcome=String(s.outcome||'').trim();s.service=lines(s.service);s.signals=lines(s.signals);s.todos=lines(s.todos)});
  applyCfg(dft);saveMeta('config',CFG);closeModal();renderMain();if(S.open)renderDrawer();toast('Đã lưu phễu');
}

/* ---------- Menu thanh trên, sao lưu ---------- */
const hm=$('#hmenu-root');
function openHMenu(btn){
  if(hm.innerHTML){hm.innerHTML='';return}
  const r=btn.getBoundingClientRect(),hasSample=Object.values(S.deals).some(d=>d.sample);
  hm.innerHTML='<div class="menu" style="top:'+(r.bottom+6)+'px;right:'+Math.max(8,innerWidth-r.right)+'px">'
    +'<button data-hact="editor">'+ic('sliders')+'Chỉnh phễu</button><hr>'
    +(IN_CLAUDE?'':'<button data-hact="sync">'+ic('cloud')+'Đồng bộ Firebase</button>')
    +'<button data-hact="backup">'+ic('down')+'Sao lưu dữ liệu</button><button data-hact="import">'+ic('up')+'Nhập bản sao lưu</button>'
    +(hasSample?'<hr><button class="danger" data-hact="clearSample">'+ic('trash')+'Xoá deal mẫu</button>':'')+'</div>';
}
async function backup(){
  const data=JSON.stringify({app:'consulting-journey',v:3,exported:new Date().toISOString(),deals:S.deals,cfg:CFG},null,1);
  const name='consulting-sales-journey-'+isoDay()+'.json';
  if(S.dl){try{await S.dl.save({filename:name,data:data});return}catch(e){if(e&&(e.code==='declined'||e.code==='rate_limited'))return}}
  if(!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);return}
  try{await navigator.clipboard.writeText(data);toast('Đã chép bản sao lưu vào bộ nhớ tạm. Dán vào một file .json để giữ.')}catch(e){toast('Khung này không cho tải file. Mở artifact trong tab riêng rồi thử lại.')}
}
$('#imp').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];e.target.value='';if(!file)return;
  let o;try{o=JSON.parse(await file.text())}catch(err){toast('File không đọc được. Chọn đúng file sao lưu .json.');return}
  if(!o||(o.app!=='consulting-journey'&&o.app!=='dan-loi')||!o.deals){toast('Đây không phải file sao lưu của Consulting Sales Journey.');return}
  if(o.cfg){applyCfg(clone(o.cfg));await saveMeta('config',CFG)}
  let n=0;
  for(const id of Object.keys(o.deals)){const inc=norm(o.deals[id]),mine=S.deals[id];
    if(!mine||(inc.updated||0)>(mine.updated||0)){S.deals[id]=inc;dirty.add(id);try{await flush(id)}catch(err){}n++}}
  renderMain();toast(n?'Đã gộp '+n+' deal từ bản sao lưu':'Không có gì mới trong bản sao lưu');
});
function newCode(){const a='abcdefghijkmnpqrstuvwxyz23456789',b=crypto.getRandomValues(new Uint8Array(20));return Array.from(b,(x,i)=>(i&&i%5===0?'-':'')+a[x%32]).join('')}
function openSync(){
  if(FB.code){
    modal('<div class="m-h"><span class="m-t">Đồng bộ Firebase</span>'+xBtn+'</div><p class="m-p">'+esc(fbTitle(S.sync))+'</p>'
      +'<div class="f"><label for="sy-code">Mã đồng bộ</label><input class="fld" id="sy-code" readonly value="'+esc(FB.code)+'"></div>'
      +'<p class="hint">Nhập đúng mã này trên máy khác để dùng chung dữ liệu. Giữ mã như mật khẩu: ai có mã là xem và sửa được toàn bộ deal.</p>'
      +'<div class="m-act"><button type="button" class="btn ghost" id="sy-off">Tắt đồng bộ trên máy này</button><button type="button" class="btn pri" data-x>Xong</button></div>');
    $('#sy-code').addEventListener('focus',e=>e.target.select());
    $('#sy-off').addEventListener('click',()=>{fbDisable();closeModal();toast('Đã tắt đồng bộ. Deal vẫn còn trên máy này.')});
    return;
  }
  modal('<div class="m-h"><span class="m-t">Đồng bộ Firebase</span>'+xBtn+'</div><p class="m-p">Lưu deal lên Firebase và cập nhật tức thì giữa các máy đang mở app. Mọi máy dùng chung một mã đồng bộ.</p>'
    +'<div class="f"><label for="sy-code">Mã đồng bộ</label><input class="fld" id="sy-code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Dán mã từ máy khác, hoặc bấm Tạo mã mới">'
    +'<p class="hint" id="sy-hint">Ít nhất 16 ký tự, gồm chữ không dấu, số, dấu - hoặc _. Giữ mã như mật khẩu.</p></div>'
    +'<div class="m-act"><button type="button" class="btn ghost" id="sy-gen">Tạo mã mới</button><button type="button" class="btn pri" id="sy-on">Bật đồng bộ</button></div>');
  const inp=$('#sy-code'),hint=$('#sy-hint');
  $('#sy-gen').addEventListener('click',()=>{inp.value=newCode();hint.textContent='Lưu mã này lại (VD trong Ghi chú) để nhập trên máy khác.';hint.classList.remove('err');inp.focus();inp.select()});
  $('#sy-on').addEventListener('click',()=>{
    const code=inp.value.trim();
    if(!CODE_OK.test(code)){hint.textContent='Mã cần ít nhất 16 ký tự, chỉ gồm chữ không dấu, số, dấu - hoặc _.';hint.classList.add('err');inp.focus();return}
    closeModal();fbEnable(code);
  });
  setTimeout(()=>inp.focus(),30);
}
async function clearSample(){
  const ids=Object.keys(S.deals).filter(id=>S.deals[id].sample);
  for(const id of ids){delete S.deals[id];dirty.add(id);try{await flush(id)}catch(e){}}
  if(S.open&&!S.deals[S.open])closeDrawer();renderMain();toast('Đã xoá '+ids.length+' deal mẫu');
}
document.addEventListener('click',e=>{
  const inf=e.target.closest('[data-info]');
  if(inf){e.preventDefault();if(tipPinned&&tipFor===inf)hideTip();else{showTip(inf);tipPinned=true}return}
  if(tipPinned)hideTip();
  const b=e.target.closest('[data-hact]');
  if(!b){if(hm.innerHTML&&!e.target.closest('.menu'))hm.innerHTML='';return}
  const a=b.dataset.hact;if(a!=='menu')hm.innerHTML='';
  if(a==='menu')openHMenu(b);
  else if(a==='new')openNew();
  else if(a==='editor')openEditor();
  else if(a==='sync')openSync();
  else if(a==='backup')backup();
  else if(a==='import')$('#imp').click();
  else if(a==='clearSample')clearSample();
});

/* ---------- Bảng: mở deal, kéo thả giữa các làn ---------- */
const bd=$('#board');
$('#tablist').addEventListener('click',e=>{const t=e.target.closest('[data-tab]');if(!t)return;S.tab=t.dataset.tab;LS.set('cj.tab',S.tab);S.q='';$('#qs').value='';renderTabs();renderBoard()});
bd.addEventListener('click',e=>{if(e.target.closest('[data-info]'))return;const c=e.target.closest('.card[data-id]');if(c)openDrawer(c.dataset.id)});
bd.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const c=e.target.closest('.card[data-id]');if(c&&e.target===c){e.preventDefault();openDrawer(c.dataset.id)}});
bd.addEventListener('dragstart',e=>{const c=e.target.closest('.card[data-id]');if(!c)return;S.dragId=c.dataset.id;try{e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'}catch(err){}c.classList.add('dragging');hideTip()});
bd.addEventListener('dragend',()=>{S.dragId=null;bd.querySelectorAll('.dragging,.drop').forEach(x=>x.classList.remove('dragging','drop'))});
bd.addEventListener('dragover',e=>{if(!S.dragId)return;const col=e.target.closest('.col[data-st]');if(!col)return;e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(err){}if(!col.classList.contains('drop')){bd.querySelectorAll('.col.drop').forEach(x=>x.classList.remove('drop'));col.classList.add('drop')}});
bd.addEventListener('dragleave',e=>{const col=e.target.closest('.col[data-st]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('drop')});
bd.addEventListener('drop',e=>{const col=e.target.closest('.col[data-st]');if(!col||!S.dragId)return;e.preventDefault();const id=S.dragId;S.dragId=null;col.classList.remove('drop');requestMove(id,col.dataset.st)});
$('#qs').addEventListener('input',e=>{S.q=e.target.value.trim();renderTabs();renderBoard()});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(tipFor){hideTip();return}
  if(mr.innerHTML){closeModal();return}
  if(hm.innerHTML){hm.innerHTML='';return}
  if(S.open){if(S.ui.menu||S.ui.panel){S.ui={};renderDrawer()}else closeDrawer()}
});

renderTabs();
init();
})();
</script>
